[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@chainlink/contracts=lib/chainlink-brownie-contracts/contracts",
    "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts",
]

[invariant]
runs = 128
depth = 128
fail_on_revert = true # false goes for quick invariant test but as you can see, in terminal when running certain test for contract args are totally horrible numbers

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
